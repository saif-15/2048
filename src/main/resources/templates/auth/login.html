<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container narrow">
    <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to keep climbing the leaderboard.</p>

        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="alert alert-error" th:if="${param.error}">Invalid username or password, or the account is disabled.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>

        <form th:action="@{/login}" method="post" class="form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username"
                   th:value="${username}">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">

            <label class="checkbox"><input type="checkbox" name="remember-me"> Remember me for 14 days</label>

            <button type="submit" class="btn btn-block">Log in</button>
        </form>
        <p class="switch">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
