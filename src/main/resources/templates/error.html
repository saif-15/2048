<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container narrow center">
    <div class="card">
        <div class="error-code" th:text="${status}">404</div>
        <h1 th:switch="${status}">
            <span th:case="404">Page not found</span>
            <span th:case="403">You don't have access to this page</span>
            <span th:case="*">Something went wrong</span>
        </h1>
        <p class="muted" th:text="${error}">Error</p>
        <a class="btn" th:href="@{/}">Back home</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
