# ---- Dev profile: H2 ----------------------------------------------------------
# Data is kept in an H2 file database under ./data, in MySQL compatibility mode,
# so no database server is needed.
spring.datasource.url=jdbc:h2:file:./data/game2048;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/game2048;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE, user: sa, no password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
