spring.application.name=2048
server.port=${PORT:8080}

# ---- Data tier: MySQL -----------------------------------------------------
# The database is created automatically on first start. Override any value with
# environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/game2048?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Presentation tier ----------------------------------------------------
spring.thymeleaf.cache=false

# ---- Security -------------------------------------------------------------
app.security.remember-me-key=${REMEMBER_ME_KEY:change-this-remember-me-key-2048}
server.servlet.session.timeout=60m

# Bootstrap administrator, created on first start if it does not exist.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@game2048.local}
app.admin.password=${ADMIN_PASSWORD:Admin@2048}
