spring.application.name=2048
server.port=${PORT:8080}

# ---- Data tier -------------------------------------------------------------
# Set by the Maven profile: dev (H2, default) or mysql. Can be overridden at
# runtime with SPRING_PROFILES_ACTIVE. Datasource settings live in
# application-dev.properties and application-mysql.properties.
spring.profiles.active=@spring.profiles.active@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Presentation tier ----------------------------------------------------
spring.thymeleaf.cache=false

# ---- Security -------------------------------------------------------------
app.security.remember-me-key=${REMEMBER_ME_KEY:change-this-remember-me-key-2048}
server.servlet.session.timeout=60m

# Bootstrap administrator, created on first start if it does not exist.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@game2048.local}
app.admin.password=${ADMIN_PASSWORD:Admin@2048}
